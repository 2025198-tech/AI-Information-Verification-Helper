<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 정보 검증 도우미 (WebLLM & OpenAlex)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- WebLLM CDN -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";
    window.webllm = webllm;
  </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- 1. 접속 시 사양 선택 모달 (팝업) -->
  <div id="deviceModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 text-center border border-slate-100">
      <div class="text-4xl mb-3">⚙️</div>
      <h2 class="text-xl font-bold text-slate-800 mb-2">실행 환경 선택</h2>
      <p class="text-sm text-slate-600 mb-6">
        접속하신 기기(스마트폰 또는 PC)에 맞는 옵션을 선택해 주세요.<br>
        기기 메모리에 최적화된 AI 모델이 구동됩니다.
      </p>

      <div class="space-y-3">
        <!-- 저사양/모바일 버튼 -->
        <button onclick="selectDeviceMode('mobile')" class="w-full p-4 border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 rounded-xl text-left transition flex items-center justify-between group">
          <div>
            <div class="font-bold text-emerald-800 text-sm">📱 저사양 / 모바일 권장 모드</div>
            <div class="text-xs text-emerald-600 mt-0.5">초경량 Qwen 2.5 (0.5B) 모델 사용 (메모리 절약)</div>
          </div>
          <span class="text-emerald-500 font-bold group-hover:translate-x-1 transition-transform">선택 →</span>
        </button>

        <!-- 고사양/PC 버튼 -->
        <button onclick="selectDeviceMode('pc')" class="w-full p-4 border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 rounded-xl text-left transition flex items-center justify-between group">
          <div>
            <div class="font-bold text-indigo-800 text-sm">💻 고사양 / PC 권장 모드</div>
            <div class="text-xs text-indigo-600 mt-0.5">고성능 Llama 3.2 (1B) 모델 사용 (정확도 향상)</div>
          </div>
          <span class="text-indigo-500 font-bold group-hover:translate-x-1 transition-transform">선택 →</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. 메인 대시보드 UI -->
  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-indigo-600 mb-2">🔍 WebLLM & OpenAlex AI 팩트체커</h1>
      <p class="text-slate-600">API 키 없이 브라우저 AI와 학술 데이터베이스로 실시간 검증합니다.</p>
    </header>

    <!-- 설정 및 엔진 초기화 -->
    <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-slate-200">
      <h2 class="text-lg font-bold mb-4 text-slate-700">1. 시스템 및 백엔드 설정</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">GAS Web App URL (구글 시트 저장용)</label>
          <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:bg-white transition">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">WebLLM AI 모델 선택</label>
          <select id="modelSelect" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:bg-white transition">
            <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">📱 Qwen 2.5 0.5B (저사양/모바일용)</option>
            <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">💻 Llama 3.2 1B (고사양/PC용)</option>
          </select>
        </div>
      </div>
      <div class="mt-4 flex items-center gap-4">
        <button id="initEngineBtn" onclick="initWebLLM()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-700 font-medium text-sm transition shadow-sm">
          🤖 브라우저 AI 엔진 로드하기
        </button>
        <span id="engineStatus" class="text-sm font-semibold text-amber-600">⚠️ 기기 사양 모드를 선택해 주세요.</span>
      </div>
    </div>

    <!-- 검증 입력 창 및 결과 창 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <!-- 입력 창 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3 text-slate-700">AI 원문 입력</h2>
        <input type="text" id="docTitle" placeholder="정보 주제 (예: 아스피린의 효능)" class="w-full p-2.5 border rounded-lg text-sm mb-3">
        <textarea id="rawText" rows="8" placeholder="검증할 AI 작성 텍스트를 입력하세요..." class="w-full p-3 border rounded-lg text-sm mb-3"></textarea>
        
        <button id="verifyBtn" onclick="startVerification()" disabled class="w-full bg-slate-300 text-slate-500 py-3 rounded-lg font-bold text-sm cursor-not-allowed transition">
          ✨ OpenAlex + WebLLM 검증 시작하기
        </button>
      </div>

      <!-- 결과 창 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3 text-slate-700">검증 및 분석 결과</h2>
        
        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg mb-4 border border-slate-100">
          <span class="text-sm font-medium text-slate-600">신뢰도 스코어</span>
          <span id="scoreText" class="text-3xl font-black text-slate-300">-%</span>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-600 mb-1">OpenAlex 기반 참고 학술 출처</label>
          <div id="sourcesList" class="p-3 bg-slate-50 rounded-lg border text-xs min-h-[60px] text-slate-600 leading-relaxed">
            검증을 실행하면 관련 학술 논문 출처가 이곳에 표시됩니다.
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">최종 교정문</label>
          <textarea id="verifiedText" rows="5" class="w-full p-3 border rounded-lg text-sm bg-slate-50 text-slate-700" readonly placeholder="교정된 결과가 여기에 표시됩니다."></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    let engine = null;
    let isEngineReady = false; // 엔진 로딩 완료 상태 관리 플래그

    // 1. 모달에서 사양 모드 선택 시 처리 함수
    function selectDeviceMode(mode) {
      const selectEl = document.getElementById("modelSelect");
      const modal = document.getElementById("deviceModal");

      if (mode === 'mobile') {
        selectEl.value = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
      } else if (mode === 'pc') {
        selectEl.value = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
      }

      modal.classList.add("hidden");
      initWebLLM();
    }

    // 2. WebLLM 엔진 초기화 함수 (오류 보완)
    async function initWebLLM() {
      const statusEl = document.getElementById("engineStatus");
      const model = document.getElementById("modelSelect").value;
      const btn = document.getElementById("initEngineBtn");
      const verifyBtn = document.getElementById("verifyBtn");

      try {
        isEngineReady = false;
        verifyBtn.disabled = true;
        verifyBtn.className = "w-full bg-slate-300 text-slate-500 py-3 rounded-lg font-bold text-sm cursor-not-allowed transition";

        statusEl.className = "text-sm font-semibold text-indigo-600";
        statusEl.innerText = "⏳ AI 모델 다운로드 및 메모리 로드 중...";
        btn.disabled = true;

        // 엔진 생성 및 모델 로드 완료까지 대기
        engine = await window.webllm.CreateMLCEngine(model, {
          initProgressCallback: (progress) => {
            const pct = Math.round(progress.progress * 100);
            statusEl.innerText = `⏳ 모델 로딩 중: ${pct}% (${progress.text || ''})`;
          }
        });

        // 정상 준비 완료 시 플래그 설정 및 버튼 활성화
        isEngineReady = true;
        statusEl.className = "text-sm font-semibold text-emerald-600";
        statusEl.innerText = "✅ AI 엔진 준비 완료!";
        
        verifyBtn.disabled = false;
        verifyBtn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold text-sm cursor-pointer transition shadow-md";
      } catch (err) {
        isEngineReady = false;
        statusEl.className = "text-sm font-semibold text-red-600";
        statusEl.innerText = "❌ 엔진 로드 실패 (WebGPU 미지원 또는 메모리 부족)";
        btn.disabled = false;
        console.error("WebLLM Init Error:", err);
      }
    }

    // 3. OpenAlex 논문 데이터 검색 함수
    async function fetchOpenAlexPapers(query) {
      try {
        const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&per-page=3`;
        const res = await fetch(url);
        const data = await res.json();
        
        return data.results.map(paper => ({
          title: paper.title,
          year: paper.publication_year,
          doi: paper.doi || paper.id
        }));
      } catch (e) {
        return [];
      }
    }

    // 4. 통합 검증 실행 함수
    async function startVerification() {
      // 안전 상태 점검
      if (!isEngineReady || !engine) {
        alert("AI 엔진이 아직 로드되지 않았습니다. 상단의 '브라우저 AI 엔진 로드하기' 버튼을 눌러 로딩을 먼저 마쳐주세요.");
        return;
      }

      const rawText = document.getElementById("rawText").value;
      const title = document.getElementById("docTitle").value || rawText.slice(0, 15);
      const verifyBtn = document.getElementById("verifyBtn");
      
      if (!rawText.trim()) return alert("검증할 AI 원문을 입력해 주세요.");

      verifyBtn.disabled = true;
      verifyBtn.innerText = "⏳ OpenAlex 논문 검색 및 AI 교차 검증 중...";

      // Step A: OpenAlex 논문 검색
      const papers = await fetchOpenAlexPapers(title);
      const sourcesList = document.getElementById("sourcesList");
      
      if (papers.length > 0) {
        sourcesList.innerHTML = papers.map(p => `• <b>${p.title}</b> (${p.year}) <br><a href="${p.doi}" target="_blank" class="text-indigo-600 underline">${p.doi}</a>`).join("<br>");
      } else {
        sourcesList.innerText = "관련 학술 논문을 찾지 못했습니다.";
      }

      // Step B: WebLLM 검증 실행
      const prompt = `
        [검증 대상 텍스트]: "${rawText}"
        [참고 논문 리스트]: ${JSON.stringify(papers.map(p => p.title))}
        
        위 논문 데이터를 바탕으로 텍스트의 사실 여부를 검증하고, 반드시 아래 JSON 포맷으로만 답변하세요:
        {"score": 85, "correctedText": "교정된 전체 텍스트"}
      `;

      try {
        const response = await engine.chat.completions.create({
          messages: [{ role: "user", content: prompt }],
          temperature: 0.1
        });

        const reply = response.choices[0].message.content;
        
        const jsonStart = reply.indexOf('{');
        const jsonEnd = reply.lastIndexOf('}') + 1;
        
        if (jsonStart !== -1 && jsonEnd !== -1) {
          const parsed = JSON.parse(reply.substring(jsonStart, jsonEnd));
          document.getElementById("scoreText").innerText = parsed.score + "%";
          document.getElementById("scoreText").className = "text-3xl font-black text-emerald-600";
          document.getElementById("verifiedText").value = parsed.correctedText;
          saveToGas(title, rawText, parsed.correctedText, parsed.score, papers);
        } else {
          document.getElementById("verifiedText").value = reply;
        }

      } catch (e) {
        alert("검증 과정 중 오류가 발생했습니다: " + e.message);
        console.error("Verification Error:", e);
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.innerText = "✨ OpenAlex + WebLLM 검증 시작하기";
      }
    }

    // 5. GAS 구글 시트 저장 함수
    async function saveToGas(title, rawText, verifiedText, score, papers) {
      const gasUrl = document.getElementById("gasUrl").value;
      if (!gasUrl) return;

      const payload = {
        id: Date.now(),
        date: new Date().toLocaleString("ko-KR"),
        title: title,
        score: score,
        checks: { source: papers.length > 0, cross: true, recency: true, logic: true },
        rawText: rawText,
        verifiedText: verifiedText,
        sources: papers.map(p => p.title).join("; "),
        notes: "WebLLM & OpenAlex 자동 검증 완료"
      };

      fetch(gasUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }
  </script>
</body>
</html>
