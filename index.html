<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 정보 검증 도우미 (OpenAlex 무키 기반)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-indigo-600 mb-2">🔍 범용 AI 팩트체커</h1>
      <p class="text-slate-600">API 키 발급 없이 학술 데이터베이스(OpenAlex) 기반으로 실시간 교차 검증합니다.</p>
    </header>

    <!-- 백엔드 설정 -->
    <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-slate-200">
      <h2 class="text-lg font-bold mb-3 text-slate-700">1. 백엔드 저장소 설정 (선택사항)</h2>
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-600">GAS Web App URL (구글 시트 자동 저장용)</label>
        <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:bg-white transition">
      </div>
    </div>

    <!-- 입력 창 및 결과 창 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <!-- 입력 창 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3 text-slate-700">AI 원문 입력</h2>
        <input type="text" id="docTitle" placeholder="정보 주제 (예: 아스피린의 효능)" class="w-full p-2.5 border rounded-lg text-sm mb-3">
        <textarea id="rawText" rows="8" placeholder="검증할 AI 작성 텍스트를 입력하세요..." class="w-full p-3 border rounded-lg text-sm mb-3"></textarea>
        
        <button id="verifyBtn" onclick="startVerification()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-bold text-sm transition shadow-md">
          ✨ API 키 없이 학술 교차 검증 실행하기
        </button>
      </div>

      <!-- 결과 창 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3 text-slate-700">검증 및 분석 결과</h2>
        
        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg mb-4 border border-slate-100">
          <span class="text-sm font-medium text-slate-600">학술 신뢰도 스코어</span>
          <span id="scoreText" class="text-3xl font-black text-slate-300">-%</span>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-600 mb-1">OpenAlex 기반 교차 검증 학술 논문</label>
          <div id="sourcesList" class="p-3 bg-slate-50 rounded-lg border text-xs min-h-[60px] text-slate-600 leading-relaxed">
            검증을 실행하면 교차 검증된 관련 학술 출처가 이곳에 표시됩니다.
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">분석 및 검증 리포트</label>
          <textarea id="verifiedText" rows="5" class="w-full p-3 border rounded-lg text-sm bg-slate-50 text-slate-700" readonly placeholder="분석 결과 및 교정 리포트가 여기에 표시됩니다."></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. OpenAlex API 논문 검색 (API 키 전혀 필요 없음)
    async function fetchOpenAlexPapers(query) {
      try {
        const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&per-page=3`;
        const res = await fetch(url);
        const data = await res.json();
        
        return data.results.map(paper => ({
          title: paper.title,
          year: paper.publication_year,
          doi: paper.doi || paper.id,
          citedBy: paper.cited_by_count || 0
        }));
      } catch (e) {
        return [];
      }
    }

    // 2. 메인 검증 알고리즘 실행
    async function startVerification() {
      const gasUrl = document.getElementById("gasUrl").value.trim();
      const rawText = document.getElementById("rawText").value.trim();
      const title = document.getElementById("docTitle").value.trim() || rawText.slice(0, 15);
      const verifyBtn = document.getElementById("verifyBtn");

      if (!rawText) return alert("검증할 AI 원문을 입력해 주세요.");

      verifyBtn.disabled = true;
      verifyBtn.innerText = "⏳ OpenAlex 학술 데이터 베이스 실시간 교차 검증 중...";

      // Step A: OpenAlex 교차 데이터 수집
      const papers = await fetchOpenAlexPapers(title);
      const sourcesList = document.getElementById("sourcesList");
      
      let calculatedScore = 50; // 기본 스코어
      let reportText = "";

      if (papers.length > 0) {
        sourcesList.innerHTML = papers.map(p => 
          `• <b>${p.title}</b> (${p.year}) - 피인용: ${p.citedBy}회<br><a href="${p.doi}" target="_blank" class="text-indigo-600 underline">${p.doi}</a>`
        ).join("<br><br>");

        // 학술 데이터 기반 신뢰도 스코어 산출 알고리즘
        const hasRecentPaper = papers.some(p => p.year >= 2020);
        const highCitations = papers.some(p => p.citedBy > 10);
        
        calculatedScore = 70;
        if (hasRecentPaper) calculatedScore += 15;
        if (highCitations) calculatedScore += 15;

        reportText = `[학술 교차 검증 완료]\n- 검색된 관련 논문: ${papers.length}건\n- 최신 연구 포함 여부: ${hasRecentPaper ? '확인됨 (2020년 이후)' : '미포함'}\n- 신뢰도 요약: 학술 데이터베이스에 등록된 출처가 확인되었습니다. 원문의 세부 수치 및 노벨상/특정 효능 주장은 위 논문 DOI 링크를 통해 대조하세요.`;
      } else {
        sourcesList.innerText = "관련 학술 논문을 찾지 못했습니다.";
        calculatedScore = 30;
        reportText = `[학술 교차 검증 미흡]\n- OpenAlex 데이터베이스에서 명확한 교차 검증 논문을 발견하지 못했습니다.\n- 출처 미상이므로 원문 정보의 신뢰도가 낮을 수 있습니다.`;
      }

      // UI 갱신
      document.getElementById("scoreText").innerText = calculatedScore + "%";
      document.getElementById("scoreText").className = calculatedScore >= 70 ? "text-3xl font-black text-emerald-600" : "text-3xl font-black text-amber-500";
      document.getElementById("verifiedText").value = reportText;

      // Step B: GAS 시트 저장 (URL이 있을 경우 실행)
      if (gasUrl) {
        saveToGas(gasUrl, title, rawText, reportText, calculatedScore, papers);
      }

      verifyBtn.disabled = false;
      verifyBtn.innerText = "✨ API 키 없이 학술 교차 검증 실행하기";
    }

    // 3. 구글 시트 백엔드 저장 함수
    async function saveToGas(gasUrl, title, rawText, reportText, score, papers) {
      const payload = {
        action: "saveRecord",
        data: {
          id: Date.now(),
          date: new Date().toLocaleString("ko-KR"),
          title: title,
          score: score,
          rawText: rawText,
          verifiedText: reportText,
          sources: papers.map(p => p.title).join("; ")
        }
      };

      fetch(gasUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }
  </script>
</body>
</html>
