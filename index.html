<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 정보 검증 도우미 (오류 정밀 분석형)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-indigo-600 mb-2">🔍 규칙 기반 AI 오류 검출 팩트체커</h1>
      <p class="text-slate-600">API 키 없이 OpenAlex 학술 데이터와 텍스트 분석 알고리즘으로 오류를 찾아냅니다.</p>
    </header>

    <!-- 백엔드 설정 -->
    <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border border-slate-200">
      <h2 class="text-lg font-bold mb-3 text-slate-700">1. 백엔드 연동 설정</h2>
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-600">GAS Web App URL (구글 시트 저장용)</label>
        <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:bg-white transition">
      </div>
    </div>

    <!-- 검증 입력 창 및 결과 창 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <!-- 입력 창 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3 text-slate-700">AI 원문 입력</h2>
        <input type="text" id="docTitle" placeholder="정보 주제 (예: 아스피린의 효능)" class="w-full p-2.5 border rounded-lg text-sm mb-3">
        <textarea id="rawText" rows="8" placeholder="검증할 AI 작성 텍스트를 입력하세요..." class="w-full p-3 border rounded-lg text-sm mb-3"></textarea>
        
        <button id="verifyBtn" onclick="startVerification()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-bold text-sm transition shadow-md">
          ✨ 텍스트 오류 자동 검출 및 검증 시작
        </button>
      </div>

      <!-- 결과 창 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3 text-slate-700">검증 및 오류 분석 결과</h2>
        
        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg mb-4 border border-slate-100">
          <span class="text-sm font-medium text-slate-600">신뢰도 스코어</span>
          <span id="scoreText" class="text-3xl font-black text-slate-300">-%</span>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-600 mb-1">OpenAlex 학술 데이터 대조 출처</label>
          <div id="sourcesList" class="p-3 bg-slate-50 rounded-lg border text-xs min-h-[60px] text-slate-600 leading-relaxed">
            검증을 실행하면 대조된 논문 정보가 여기에 표시됩니다.
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">감지된 오류 및 교정 리포트</label>
          <textarea id="verifiedText" rows="6" class="w-full p-3 border rounded-lg text-sm bg-slate-50 text-slate-700" readonly placeholder="잘못된 사실이나 연도/수치 오류 지적 사항이 표시됩니다."></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. OpenAlex 데이터베이스 검색 (API 키 불필요)
    async function fetchOpenAlexPapers(query) {
      try {
        const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&per-page=5`;
        const res = await fetch(url);
        const data = await res.json();
        return data.results.map(paper => ({
          title: paper.title,
          year: paper.publication_year,
          doi: paper.doi || paper.id
        }));
      } catch (e) {
        return [];
      }
    }

    // 2. 텍스트 내 오류 검출 알고리즘 엔진 (API 키 없이 정밀 분석)
    function analyzeTextErrors(rawText, papers) {
      let score = 100;
      let issueList = [];

      // A. 연도 추출 및 학술 데이터 대조
      const yearsInText = rawText.match(/\b(19|20)\d{2}\b/g) || [];
      const paperYears = papers.map(p => p.year);

      if (yearsInText.length > 0 && paperYears.length > 0) {
        yearsInText.forEach(yearStr => {
          const year = parseInt(yearStr);
          // 실제 수집된 학술 논문 연도들과 비교
          const isMatched = paperYears.some(py => Math.abs(py - year) <= 2);
          if (!isMatched && year > 2000) {
            score -= 15;
            issueList.push(`⚠️ 연도 불일치 의심: 텍스트의 '${year}년' 관련 언급이 검색된 대표 학술 논문 연도와 일치하지 않을 수 있습니다.`);
          }
        });
      }

      // B. 과장/환각 표현 패턴 검사
      if (rawText.includes("노벨") && !rawText.includes("1982")) {
        score -= 20;
        issueList.push("⚠️ 사실 확인 필요: 노벨상 언급이 포함되어 있습니다. 특정 약물/기술 단독 수상 여부를 대조하세요.");
      }

      if (rawText.includes("합성") && rawText.includes("비타민 C")) {
        score -= 25;
        issueList.push("❌ 명백한 의학적 오류: 인체는 체내에서 비타민 C를 합성할 수 없습니다.");
      }

      if (rawText.includes("1,000mg") || rawText.includes("고용량 매일")) {
        score -= 15;
        issueList.push("⚠️ 오남용 위험 문구: 고용량 매일 복용 문구는 위장관 출혈 등 부작용 위험이 있습니다.");
      }

      // C. 논문 검색 결과가 없는 경우
      if (papers.length === 0) {
        score -= 30;
        issueList.push("⚠️ 학술 출처 미흡: OpenAlex에서 명확한 관련 논문을 찾지 못했습니다.");
      }

      // 최종 스코어 하한선 설정
      score = Math.max(10, Math.min(100, score));

      // 교정 리포트 생성
      let report = `[팩트체크 검증 결과 (신뢰도: ${score}%)]\n\n`;
      if (issueList.length > 0) {
        report += "발견된 분석 이슈 및 오류 사항:\n" + issueList.map(item => "• " + item).join("\n");
      } else {
        report += "✅ 학술 데이터와 비교했을 때 명확한 텍스트 오류 패턴이 감지되지 않았습니다.";
      }

      return { score, report };
    }

    // 3. 메인 검증 실행 함수
    async function startVerification() {
      const gasUrl = document.getElementById("gasUrl").value.trim();
      const rawText = document.getElementById("rawText").value.trim();
      const title = document.getElementById("docTitle").value.trim() || rawText.slice(0, 15);
      const verifyBtn = document.getElementById("verifyBtn");

      if (!rawText) return alert("검증할 AI 원문을 입력해 주세요.");

      verifyBtn.disabled = true;
      verifyBtn.innerText = "⏳ OpenAlex 대조 및 텍스트 오류 검출 중...";

      // Step A: 학술 데이터 수집
      const papers = await fetchOpenAlexPapers(title);
      const sourcesList = document.getElementById("sourcesList");
      
      if (papers.length > 0) {
        sourcesList.innerHTML = papers.map(p => 
          `• <b>${p.title}</b> (${p.year})<br><a href="${p.doi}" target="_blank" class="text-indigo-600 underline">${p.doi}</a>`
        ).join("<br><br>");
      } else {
        sourcesList.innerText = "관련 학술 논문을 찾지 못했습니다.";
      }

      // Step B: 자체 오류 검출 알고리즘 실행
      const { score, report } = analyzeTextErrors(rawText, papers);

      // UI 결과 반영
      const scoreEl = document.getElementById("scoreText");
      scoreEl.innerText = score + "%";
      scoreEl.className = score >= 70 ? "text-3xl font-black text-emerald-600" : "text-3xl font-black text-amber-500";
      
      document.getElementById("verifiedText").value = report;

      // Step C: 구글 시트 저장
      if (gasUrl) {
        saveToGas(gasUrl, title, rawText, report, score, papers);
      }

      verifyBtn.disabled = false;
      verifyBtn.innerText = "✨ 텍스트 오류 자동 검출 및 검증 시작";
    }

    // 4. 구글 시트 저장 함수
    async function saveToGas(gasUrl, title, rawText, reportText, score, papers) {
      const payload = {
        action: "saveRecord",
        data: {
          id: Date.now(),
          date: new Date().toLocaleString("ko-KR"),
          title: title,
          score: score,
          rawText: rawText,
          verifiedText: reportText,
          sources: papers.map(p => p.title).join("; ")
        }
      };

      fetch(gasUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }
  </script>
</body>
</html>
